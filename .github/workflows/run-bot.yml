name: Bot Auto Runner

on:
  workflow_dispatch:
  repository_dispatch:
    types: [run-bot-manual]
  schedule:
    # Berjalan otomatis tiap 2 jam (Format UTC)
    - cron: '0 17,19,21,23,1,3,5,7,9,11,13,15 * * *'

jobs:
  run-bot:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./botprediksi

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Install Puppeteer Browsers
        run: npx puppeteer browsers install chrome

      - name: Deteksi Mode Jam WIB & Jalankan Bot
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_TOPIC_GAMBAR_ID: ${{ secrets.TELEGRAM_TOPIC_GAMBAR_ID }}
          TELEGRAM_TOPIC_TEXT_ID: ${{ secrets.TELEGRAM_TOPIC_TEXT_ID }}
          TELEGRAM_CHAT_ID_2: ${{ secrets.TELEGRAM_CHAT_ID_2 }}
          TELEGRAM_TOPIC_GAMBAR_2_ID: ${{ secrets.TELEGRAM_TOPIC_GAMBAR_2_ID }}
        run: |
          JAM_WIB=$(TZ='Asia/Jakarta' date +'%H')
          echo "Jam Eksekusi Server (WIB): $JAM_WIB:00"
          
          # Jika Jam 00:00 atau 01:00 WIB, jalankan Mode Full Run (Grup 1 + Grup 2)
          if [ "$JAM_WIB" = "00" ] || [ "$JAM_WIB" = "01" ]; then
            echo "Mode: FULL RUN (Grup 1 + Grup 2)"
            export ONLY_GROUP_2=false
          else
            echo "Mode: REPEAT GAMBAR (Hanya Grup 2)"
            export ONLY_GROUP_2=true
          fi
          
          node bot-auto.js
