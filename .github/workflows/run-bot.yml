name: Bot Auto Runner

on:
  workflow_dispatch:
  repository_dispatch:
    types: [run-bot-manual]
  schedule:
    # Berjalan otomatis tiap 2 jam (Format UTC)
    - cron: '15 17,19,21,23,1,3,5,7,9,11,13,15 * * *'

jobs:
  run-bot:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./botprediksi

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        env:
          PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: 'true'
        run: npm install

      - name: Install Chrome for Puppeteer
        # Hanya unduh Chrome jika dipicu MANUAL oleh Admin (Full Run butuh Puppeteer)
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch'
        run: npx puppeteer browsers install chrome

      - name: Deteksi Event & Jalankan Bot
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_TOPIC_GAMBAR_ID: ${{ secrets.TELEGRAM_TOPIC_GAMBAR_ID }}
          TELEGRAM_TOPIC_TEXT_ID: ${{ secrets.TELEGRAM_TOPIC_TEXT_ID }}
          TELEGRAM_CHAT_ID_2: ${{ secrets.TELEGRAM_CHAT_ID_2 }}
          TELEGRAM_TOPIC_GAMBAR_2_ID: ${{ secrets.TELEGRAM_TOPIC_GAMBAR_2_ID }}
        run: |
          JAM_WIB=$(TZ='Asia/Jakarta' date +'%H:%M')
          echo "Waktu Eksekusi (WIB): $JAM_WIB"
          echo "Pemicu Event: ${{ github.event_name }}"

          # JIKA DIPICU MANUAL (PANEL ADMIN) -> PASTI FULL RUN
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo "Mode: FULL RUN (Pemicu Manual Admin)"
            ONLY_GROUP_2=false node bot-auto.js
          else
            # JIKA DIPICU OTOMATIS (CRON SCHEDULE 2 JAMAN) -> PASTI REPEAT GRUP 2
            echo "Mode: REPEAT GAMBAR (Otomatis Per 2 Jam -> Hanya Grup 2)"
            ONLY_GROUP_2=true node bot-auto.js
          fi
