name: Bot Auto Runner

on:
  workflow_dispatch:
  schedule:
    # Berjalan tiap 2 jam (UTC)
    - cron: '0 17,19,21,23,1,3,5,7,9,11,13,15 * * *'

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Dependencies
        run: npm install

      - name: Run Bot Task
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_TOPIC_GAMBAR_ID: ${{ secrets.TELEGRAM_TOPIC_GAMBAR_ID }}
          TELEGRAM_TOPIC_TEXT_ID: ${{ secrets.TELEGRAM_TOPIC_TEXT_ID }}
          TELEGRAM_CHAT_ID_2: ${{ secrets.TELEGRAM_CHAT_ID_2 }}
          TELEGRAM_TOPIC_GAMBAR_2_ID: ${{ secrets.TELEGRAM_TOPIC_GAMBAR_2_ID }}
        run: |
          JAM_WIB=$(TZ='Asia/Jakarta' date +'%H')
          
          # Toleransi jika GitHub Actions telat mengeksekusi di jam 00 atau 01 WIB
          if [ "$JAM_WIB" = "00" ] || [ "$JAM_WIB" = "01" ]; then
            echo "Mode: Full Run (Inisialisasi Firestore & Kirim Semua Grup)"
            echo "ONLY_GROUP_2=false" >> $GITHUB_ENV
          else
            echo "Mode: Repeat Gambar Grup 2 (Jam $JAM_WIB:00 WIB)"
            echo "ONLY_GROUP_2=true" >> $GITHUB_ENV
          fi
          
          node bot.js
