<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Template Prediksi Target4D</title>
  <!-- Font Futuristik (Orbitron) dari Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Arial', sans-serif;
    }

    body {
      background-color: #050505;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 50px;
      padding: 20px;
    }

    /* Ukuran Canvas Standar Bot (1024 x 1280 px) */
    .banner-container {
      width: 1024px;
      min-height: 1280px;
      
      /* BACKGROUND PURE CSS */
      background-color: #0b0d12;
      background-image: 
        radial-gradient(circle at 50% 20%, rgba(42, 145, 204, 0.18) 0%, transparent 60%),
        radial-gradient(circle at 50% 100%, rgba(255, 215, 0, 0.1) 0%, transparent 50%),
        radial-gradient(rgba(255, 255, 255, 0.08) 1px, transparent 1px);
      background-size: 100% 100%, 100% 100%, 18px 18px;
      
      border: 3px solid #2a91cc;
      border-radius: 12px;
      position: relative;
      padding: 25px 30px;
      color: #fff;
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.9), inset 0 0 20px rgba(42, 145, 204, 0.2);
    }

    /* Layout Header (Kiri - Tengah - Kanan) */
    .header {
      margin-bottom: 20px;
    }

    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 0 5px;
    }

    /* Style Dasar Logo */
    .logo-target {
      width: 150px;
      height: auto;
      object-fit: contain;
    }

    .logo-left {
      filter: drop-shadow(0 0 15px rgba(42, 145, 204, 0.8)) 
              brightness(1.08) 
              contrast(1.05) 
              saturate(1.1);
    }

    .logo-right {
      filter: drop-shadow(0 0 15px rgba(42, 145, 204, 0.8));
    }

    .header h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: 38px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 3px;
      text-align: center;
      background: linear-gradient(135deg, #ff007f 0%, #ff55b5 35%, #00d4ff 70%, #00f0ff 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 12px rgba(255, 0, 127, 0.7)) drop-shadow(0 0 20px rgba(0, 240, 255, 0.6));
      margin: 0 10px;
    }

    .date-box {
      width: 380px;
      height: 40px;
      margin: 10px auto 0 auto;
      border: 1.5px solid #2a91cc;
      border-radius: 20px;
      background: rgba(5, 10, 20, 0.85);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: bold;
      color: #00e1ff;
      letter-spacing: 1px;
      box-shadow: 0 0 10px rgba(42, 145, 204, 0.3), inset 0 0 10px rgba(0, 0, 0, 0.8);
    }

    /* Grid 6 Pasaran */
    .grid-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
    }

    /* Kartu Pasaran */
    .card-pasaran {
      background: linear-gradient(145deg, rgba(18, 22, 31, 0.95), rgba(10, 12, 18, 0.98));
      border: 1.5px solid rgba(42, 145, 204, 0.4);
      border-radius: 12px;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.7);
      position: relative;
    }

    .pasaran-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 20px;
      font-weight: 700;
      color: #00e1ff;
      border-bottom: 2px solid #2a91cc;
      padding-bottom: 4px;
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      text-shadow: 0 0 8px rgba(0, 225, 255, 0.5);
      text-align: center;
    }

    .section-box {
      display: flex;
      flex-direction: column;
    }

    /* LABEL DITERANGKAN & DIPERBESAR */
    .label-title {
      font-size: 15px; /* Dari 12px ke 15px */
      color: #b2cced;
      font-weight: 900;
      margin-bottom: 3px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      text-align: center;
      text-shadow: 0 0 4px rgba(42, 145, 204, 0.4);
    }

    .slot-area {
      height: 36px;
      background: rgba(0, 0, 0, 0.75);
      border: 1px solid rgba(212, 175, 55, 0.6);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: bold;
      color: #ffd700;
      letter-spacing: 2px;
      text-shadow: 0 0 6px rgba(255, 215, 0, 0.6);
      text-align: center;
      box-shadow: inset 0 0 8px rgba(0, 0, 0, 0.8);
    }

    .mini-group {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
    }
  </style>

  <script>
    // Fungsi bantuan render kartu pasaran
    function renderPasaran(list) {
      list.forEach(name => {
        document.write(`
          <div class="card-pasaran">
            <div class="pasaran-title">${name}</div>
            
            <div class="section-box">
              <div class="label-title">BBFS 5 DIGIT</div>
              <div class="slot-area"></div>
            </div>

            <div class="mini-group">
              <div class="section-box">
                <div class="label-title">CM</div>
                <div class="slot-area"></div>
              </div>
              <div class="section-box">
                <div class="label-title">CB</div>
                <div class="slot-area"></div>
              </div>
              <div class="section-box">
                <div class="label-title">TWIN</div>
                <div class="slot-area"></div>
              </div>
            </div>

            <div class="section-box">
              <div class="label-title">TOP 2D</div>
              <div class="slot-area"></div>
            </div>

            <div class="section-box">
              <div class="label-title">TOP 3D</div>
              <div class="slot-area"></div>
            </div>

            <div class="section-box">
              <div class="label-title">TOP 4D</div>
              <div class="slot-area"></div>
            </div>
          </div>
        `);
      });
    }
  </script>
</head>
<body>

  <!-- BANNER 1 (ID: banner-1) -->
  <div class="banner-container" id="banner-1">
    <div class="header">
      <div class="header-top">
        <img src="https://i.ibb.co.com/WNCPSn0h/mbahsugengkiri.png" alt="Target4D Logo Left" class="logo-target logo-left">
        <h1>PREDIKSI TARGET4D</h1>
        <img src="https://i.ibb.co.com/8n421LBG/mbahsugengkanan.png" alt="Target4D Logo Right" class="logo-target logo-right">
      </div>
      <div class="date-box"></div>
    </div>
    <div class="grid-container">
      <script>
        renderPasaran(["SINGAPORE", "MALAYSIA", "MACAU", "BUSAN NIGHT", "QATAR", "HONGKONG"]);
      </script>
    </div>
  </div>

  <!-- BANNER 2 (ID: banner-2) -->
  <div class="banner-container" id="banner-2">
    <div class="header">
      <div class="header-top">
        <img src="https://i.ibb.co.com/WNCPSn0h/mbahsugengkiri.png" alt="Target4D Logo Left" class="logo-target logo-left">
        <h1>PREDIKSI TARGET4D</h1>
        <img src="https://i.ibb.co.com/8n421LBG/mbahsugengkanan.png" alt="Target4D Logo Right" class="logo-target logo-right">
      </div>
      <div class="date-box"></div>
    </div>
    <div class="grid-container">
      <script>
        renderPasaran(["TOTOWUHAN", "HONGKONG SIANG", "SYDNEY4D", "TAIPEI", "SGMETRO", "BUSANDAY"]);
      </script>
    </div>
  </div>

  <!-- BANNER 3 (ID: banner-3) -->
  <div class="banner-container" id="banner-3">
    <div class="header">
      <div class="header-top">
        <img src="https://i.ibb.co.com/WNCPSn0h/mbahsugengkiri.png" alt="Target4D Logo Left" class="logo-target logo-left">
        <h1>PREDIKSI TARGET4D</h1>
        <img src="https://i.ibb.co.com/8n421LBG/mbahsugengkanan.png" alt="Target4D Logo Right" class="logo-target logo-right">
      </div>
      <div class="date-box"></div>
    </div>
    <div class="grid-container">
      <script>
        renderPasaran(["TOTO MACAU 1300", "TOTO MACAU 1600", "TOTO MACAU 1900", "TOTO MACAU 2200", "TOTO MACAU 2300", "TOTO MACAU 0000"]);
      </script>
    </div>
  </div>

</body>
</html>
